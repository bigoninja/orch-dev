# orch configuration — see README.md
target_repo: /path/to/target-repo
base_ref: main
integration_branch: orch/integration
worktree_root: .worktrees
model: opencode/space-bunny-free
role_models:
  planner: opencode/deepseek-v4.1-flash
  implement: opencode/space-bunny-free
  review: opencode/deepseek-v4.1-flash
  fix: opencode/space-bunny-free
  repair: opencode/deepseek-v4.1-flash
concurrency: 3
retries: 2
timeout_minutes: 45
env_passthrough: []
risky_patterns:
- db/migrations/**
- '**/auth/**'
- '**/payments/**'
- '**/gateway/**'
- .github/**
- '**/package.json'
- '**/package-lock.json'
- '**/*.env*'
notify: none
state_dir: state
runs_dir: runs
