# orch configuration — see README.md
target_repo: /path/to/target-repo
base_ref: main
integration_branch: orch/integration
worktree_root: .worktrees
model: opencode/deepseek-v4.1-flash-free
concurrency: 3
retries: 2
timeout_minutes: 45
env_passthrough: []
risky_patterns:
- db/migrations/**
- '**/auth/**'
- '**/payments/**'
- '**/gateway/**'
- .github/**
- '**/package.json'
- '**/package-lock.json'
- '**/*.env*'
notify: none
state_dir: state
runs_dir: runs
