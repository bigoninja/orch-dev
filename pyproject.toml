[project]
name = "orch"
version = "0.1.0"
requires-python = ">=3.14"
# langgraph is pinned to the verified minor line: orch.graph reads the node-local
# state view through langgraph private internals (`CONFIG_KEY_READ`), so a bumped
# read contract must be re-verified, not adopted implicitly. See
# tests/e2e/test_e2e_parallel_isolation.py.
dependencies = [
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-sqlite",
    "pydantic>=2",
    "pyyaml",
    # Comment-preserving YAML round-trip: `orch models` edits a config in place,
    # and `yaml.safe_dump` would delete the rationale comments those files carry.
    "ruamel.yaml>=0.18",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
orch = "orch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: real OpenCode/model calls; requires ORCH_SMOKE=1"]
