[project]
name = "orch"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["langgraph", "langgraph-checkpoint-sqlite", "pydantic>=2", "pyyaml"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
orch = "orch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: real OpenCode/model calls; requires ORCH_SMOKE=1"]
